version: "3.9"

services:
  redis:
    image: redis:latest
    container_name: redis_container
    environment:
      - REDIS_PASSWORD=redis
      - REDIS_USER=redis
      - REDIS_USER_PASSWORD=redis
    ports:
      - "127.0.0.1:6379:6379"
  mysql:
    image: mysql:latest
    container_name: farpost_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mydatabase
    ports:
      - "127.0.0.1:3306:3306"

    # volumes:
    #   - ./redis/data:/data
